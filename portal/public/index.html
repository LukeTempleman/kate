<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KATE — portal</title>
<style>
  :root { --base:#050A0D; --surface:#0A1116; --line:#17262E; --cyan:#00E5FF; --cyan-dim:#0E7A8A;
          --text:#D9F6FB; --dim:#6E8C96; --danger:#FF5470; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--base); color:var(--text); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
         min-height:100dvh; padding:20px; }
  header { display:flex; align-items:center; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
  h1 { color:var(--cyan); font-weight:300; letter-spacing:.4em; font-size:1.4rem; }
  nav { display:flex; gap:8px; flex-wrap:wrap; }
  nav button, .btn { background:none; border:1px solid var(--line); color:var(--dim); padding:8px 14px;
         border-radius:6px; font:inherit; font-size:.72rem; letter-spacing:.15em; cursor:pointer; }
  nav button.active { border-color:var(--cyan); color:var(--cyan); }
  main { max-width:1200px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
  .card { background:var(--surface); border-radius:8px; padding:16px; }
  .card .num { color:var(--cyan); font-size:2rem; font-weight:300; }
  .card .lbl { color:var(--dim); font-size:.7rem; letter-spacing:.15em; margin-top:4px; }
  .row { background:var(--surface); border-radius:8px; padding:12px 14px; margin-bottom:10px; }
  .row .meta { color:var(--dim); font-size:.72rem; margin-top:6px; }
  .status-done { color:var(--cyan); } .status-failed { color:var(--danger); } .status-other { color:var(--dim); }
  #graph { width:100%; height:70vh; background:var(--surface); border-radius:10px; touch-action:none; }
  .muted { color:var(--dim); font-size:.85rem; padding:20px 0; }
  pre { white-space:pre-wrap; font-size:.8rem; line-height:1.5; }
  a { color:var(--cyan); }
</style>
</head>
<body>
<header>
  <h1>KATE</h1>
  <nav id="nav"></nav>
  <button class="btn" id="tokenBtn" style="margin-left:auto">TOKEN</button>
</header>
<main id="main"><div class="muted">loading…</div></main>
<script>
const TABS = ['OVERVIEW','GRAPH','ANSWERS','SKILLS','TASKS','ARTIFACTS'];
let tab = 'OVERVIEW';
const $ = (s) => document.querySelector(s);

function token() {
  let t = localStorage.getItem('kate_token');
  if (!t) { t = prompt('Kate portal token:') || ''; localStorage.setItem('kate_token', t); }
  return t;
}
$('#tokenBtn').onclick = () => { localStorage.removeItem('kate_token'); token(); render(); };

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { authorization: 'Bearer ' + token(), ...(opts.headers||{}) } });
  if (r.status === 401) { localStorage.removeItem('kate_token'); throw new Error('bad token'); }
  return r;
}
const getJson = async (p) => (await api(p)).json();

function nav() {
  $('#nav').innerHTML = TABS.map(t =>
    `<button class="${t===tab?'active':''}" onclick="setTab('${t}')">${t}</button>`).join('');
}
window.setTab = (t) => { tab = t; render(); };

async function render() {
  nav();
  const m = $('#main');
  m.innerHTML = '<div class="muted">loading…</div>';
  try {
    if (tab === 'OVERVIEW') {
      const o = await getJson('/api/overview');
      m.innerHTML = '<div class="cards">' + Object.entries(o).map(([k,v]) =>
        `<div class="card"><div class="num">${v}</div><div class="lbl">${k.toUpperCase()}</div></div>`).join('') + '</div>';
    } else if (tab === 'GRAPH') {
      m.innerHTML = '<canvas id="graph"></canvas><div class="muted" id="gInfo">drag to pan · wheel/pinch to zoom</div>';
      drawGraph(await getJson('/api/graph'));
    } else if (tab === 'ANSWERS') {
      const rows = await getJson('/api/answers');
      m.innerHTML = rows.length ? rows.map(t => `<div class="row">${esc(t.text)}
        <div class="meta">${t.model_used||'?'} · ${t.latency_ms||0}ms · ${t.rating>0?'👍':t.rating<0?'👎':''} · ${when(t.created_at)}</div></div>`).join('')
        : '<div class="muted">no answers synced yet</div>';
    } else if (tab === 'SKILLS') {
      const rows = await getJson('/api/skills');
      m.innerHTML = rows.length ? rows.map(s => `<div class="row"><b style="color:var(--cyan)">${esc(s.name)}</b> · v${s.version}
        <div class="meta">${esc(s.created_via)}</div><pre>${esc(pretty(s.definition_json))}</pre></div>`).join('')
        : '<div class="muted">no skills synced yet</div>';
    } else if (tab === 'TASKS') {
      const rows = await getJson('/api/runs');
      m.innerHTML = rows.length ? rows.map(r => `<div class="row">#${esc(String(r.id))} ${esc(r.skill_id)}
        <span class="status-${r.status==='done'?'done':r.status==='failed'?'failed':'other'}" style="float:right">${esc(r.status.toUpperCase())}</span>
        <div class="meta">${esc(r.inputs_json||'')} · ${esc(r.ran_on||'')}</div></div>`).join('')
        : '<div class="muted">no task runs synced yet</div>';
    } else if (tab === 'ARTIFACTS') {
      const rows = await getJson('/api/artifacts');
      m.innerHTML = rows.length ? rows.map(a => `<div class="row"><a href="#" onclick="openArtifact('${encodeURIComponent(a.key)}');return false">${esc(a.key)}</a>
        <div class="meta">${(a.size/1024).toFixed(1)} KB · ${when(Date.parse(a.uploaded))}</div></div>`).join('')
        : '<div class="muted">no artifacts yet</div>';
    }
  } catch (e) {
    m.innerHTML = `<div class="muted">error: ${esc(String(e.message||e))}</div>`;
  }
}

window.openArtifact = async (key) => {
  const r = await api('/api/artifact/' + key);
  $('#main').innerHTML = `<button class="btn" onclick="setTab('ARTIFACTS')">← BACK</button><div class="row" style="margin-top:12px"><pre>${esc(await r.text())}</pre></div>`;
};

function esc(s){ return String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pretty(j){ try { return JSON.stringify(JSON.parse(j),null,2); } catch { return j; } }
function when(ts){ return ts ? new Date(ts).toLocaleString() : ''; }

// --- force graph (same physics as the phone) ---
function drawGraph({nodes, edges}) {
  const canvas = $('#graph');
  const dpr = devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
  const ctx = canvas.getContext('2d');
  const pos = new Map();
  nodes.forEach(n => pos.set(n.id, {x:(Math.random()-.5)*900, y:(Math.random()-.5)*900, vx:0, vy:0}));
  let alpha = 1, scale = .7, panX = 0, panY = 0;

  function step() {
    const k = 90;
    const ids = nodes.map(n => n.id);
    for (let i = 0; i < ids.length; i++) for (let j = i+1; j < ids.length; j++) {
      const a = pos.get(ids[i]), b = pos.get(ids[j]);
      let dx = a.x-b.x, dy = a.y-b.y, d2 = dx*dx+dy*dy || 1, d = Math.sqrt(d2);
      const f = (k*k/d)*.02*alpha, fx = dx/d*f, fy = dy/d*f;
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    }
    for (const e of edges) {
      const a = pos.get(e.from_node), b = pos.get(e.to_node);
      if (!a || !b) continue;
      const dx = b.x-a.x, dy = b.y-a.y, d = Math.max(.1, Math.hypot(dx,dy));
      const f = (d-k)*.05*alpha, fx = dx/d*f, fy = dy/d*f;
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    }
    for (const p of pos.values()) {
      p.vx -= p.x*.005*alpha; p.vy -= p.y*.005*alpha;
      p.vx *= .85; p.vy *= .85; p.x += p.vx; p.y += p.vy;
    }
    alpha *= .985;
  }

  function draw() {
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
    ctx.translate(canvas.clientWidth/2+panX, canvas.clientHeight/2+panY);
    ctx.scale(scale, scale);
    ctx.strokeStyle = '#17262E';
    for (const e of edges) {
      const a = pos.get(e.from_node), b = pos.get(e.to_node);
      if (!a || !b) continue;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
    ctx.font = '11px ui-monospace'; ctx.textAlign = 'center';
    for (const n of nodes) {
      const p = pos.get(n.id);
      const r = n.kind==='conversation'?11 : n.kind==='topic'?8 : n.kind==='entity'?6.5 : n.kind==='skill'?9 : 3;
      ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7);
      if (n.kind==='memory') { ctx.fillStyle = 'rgba(110,140,150,.4)'; ctx.fill(); }
      else if (n.kind==='conversation') { ctx.strokeStyle = '#00E5FF'; ctx.stroke(); ctx.strokeStyle='#17262E'; }
      else { ctx.fillStyle = '#00E5FF'; ctx.fill(); }
      if (n.kind!=='memory' && scale > .45) { ctx.fillStyle = '#6E8C96'; ctx.fillText(n.label.slice(0,18), p.x, p.y-r-6); }
    }
    if (alpha > .01) { step(); requestAnimationFrame(draw); }
  }
  draw();

  let dragging = false, lx = 0, ly = 0;
  canvas.onpointerdown = (e) => { dragging = true; lx = e.clientX; ly = e.clientY; };
  canvas.onpointermove = (e) => { if (dragging) { panX += e.clientX-lx; panY += e.clientY-ly; lx = e.clientX; ly = e.clientY; alpha = Math.max(alpha,.011); requestAnimationFrame(draw); } };
  canvas.onpointerup = () => dragging = false;
  canvas.onwheel = (e) => { e.preventDefault(); scale = Math.min(4, Math.max(.15, scale * (e.deltaY<0?1.1:.9))); alpha = Math.max(alpha,.011); requestAnimationFrame(draw); };
}

render();
</script>
</body>
</html>
