<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MONEYPENNY</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2232%22 fill=%22none%22 stroke=%22%23FF6B7A%22 stroke-width=%224%22/><circle cx=%2250%22 cy=%2250%22 r=%229%22 fill=%22%23FF6B7A%22/></svg>">
<style>
  :root { --base:#0D0709; --surface:#161014; --line:#2E2226; --red:#FF6B7A; --red-dim:#9E4552;
          --text:#F7E9EB; --dim:#9C8A8E; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--base); color:var(--text); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
         height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:center; gap:8px; padding:14px 16px; flex-wrap:wrap; }
  h1 { color:var(--red); font-weight:500; letter-spacing:.15em; font-size:1.05rem; }
  .pill { font-size:.6rem; letter-spacing:.12em; color:var(--dim); border:1px solid var(--line);
          border-radius:999px; padding:4px 10px; cursor:pointer; user-select:none; }
  .pill.on { color:var(--red); border-color:var(--red); }
  #orbWrap { display:flex; justify-content:center; padding:6px 0 0; }
  canvas#orb { width:190px; height:190px; }
  #status { text-align:center; color:var(--dim); font-size:.8rem; min-height:1.4em; padding:4px 16px; }
  #stats { text-align:center; color:var(--red-dim); font-size:.62rem; letter-spacing:.1em; min-height:1.2em; }
  #log { flex:1; overflow-y:auto; padding:8px 20px 12px; }
  .who { font-size:.62rem; letter-spacing:.15em; color:var(--dim); margin-top:12px; }
  .who.penny { color:var(--red-dim); }
  .msg { font-size:1rem; line-height:1.55; }
  .msg.penny { color:var(--text); }
  .msg.you { color:var(--dim); }
  footer { display:flex; gap:10px; padding:12px 16px calc(14px + env(safe-area-inset-bottom)); }
  #talk { flex:0 0 auto; min-width:112px; height:58px; border-radius:20px; border:1.5px solid var(--red);
          background:none; color:var(--red); font:inherit; font-size:.95rem; letter-spacing:.15em; }
  #talk.listening { background:var(--red); color:var(--base); }
  #talk:disabled { opacity:.4; }
  #text { flex:1; height:58px; border-radius:20px; border:1px solid var(--line); background:var(--surface);
          color:var(--text); font:inherit; padding:0 16px; font-size:.95rem; }
  #text:focus { outline:none; border-color:var(--red-dim); }
  #send { flex:0 0 auto; width:58px; height:58px; border-radius:20px; border:1px solid var(--line);
          background:none; color:var(--red); font-size:1.3rem; }
</style>
</head>
<body>
<header>
  <h1>MONEYPENNY</h1>
  <span class="pill" id="convBtn">AUTO-LISTEN</span>
  <span class="pill on" id="voiceBtn">VOICE·HER</span>
  <span class="pill" id="pickBtn" style="display:none">▸ PHONE VOICE</span>
  <span class="pill" style="margin-left:auto"><a href="/dashboard" style="color:inherit;text-decoration:none">DASH</a></span>
</header>
<div id="orbWrap"><canvas id="orb" width="380" height="380"></canvas></div>
<div id="status">tap TALK and speak</div>
<div id="stats"></div>
<div id="log"></div>
<footer>
  <button id="talk">TALK</button>
  <input id="text" placeholder="or type to her…" autocomplete="off">
  <button id="send">➤</button>
</footer>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const statusEl = $('#status'), statsEl = $('#stats'), logEl = $('#log'), talkBtn = $('#talk'), textIn = $('#text');

// ---- token ----
(function initToken() {
  const m = location.hash.match(/t=([A-Za-z0-9]+)/);
  if (m) { localStorage.setItem('kate_token', m[1]); history.replaceState(null, '', location.pathname); }
})();
function token() {
  let t = localStorage.getItem('kate_token');
  if (!t) { t = prompt('Paste your Moneypenny key (one time):') || ''; localStorage.setItem('kate_token', t); }
  return t;
}
async function api(path, body, signal) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token() },
    body: JSON.stringify(body), signal,
  });
  if (r.status === 401) { localStorage.removeItem('kate_token'); throw new Error('wrong key — reload and paste it again'); }
  if (!r.ok) throw new Error('server ' + r.status);
  return r.json();
}

// ---- orb ----
const ctx = $('#orb').getContext('2d');
let mode = 'idle', amp = 0, phase = 0;
function drawOrb() {
  phase += 0.016;
  const c = 190, r = 62;
  ctx.clearRect(0, 0, 380, 380);
  const glow = ctx.createRadialGradient(c, c, 0, c, c, r * 2.1);
  const g = mode === 'listening' ? 0.5 : mode === 'speaking' ? 0.32 + amp * 0.3 : 0.25;
  glow.addColorStop(0, `rgba(255,107,122,${g})`);
  glow.addColorStop(1, 'rgba(255,107,122,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(c, c, r * 2.1, 0, 7); ctx.fill();
  ctx.strokeStyle = '#FF6B7A'; ctx.lineWidth = 2.4;
  const breath = mode === 'idle' ? 1 + 0.03 * Math.sin(phase * 1.6) : 1;
  ctx.beginPath(); ctx.arc(c, c, r * breath, 0, 7); ctx.stroke();
  ctx.fillStyle = '#FF6B7A'; ctx.beginPath(); ctx.arc(c, c, 10, 0, 7); ctx.fill();
  if (mode === 'listening') {
    for (let i = 0; i < 3; i++) {
      const p = ((phase * 0.5) + i / 3) % 1;
      ctx.strokeStyle = `rgba(255,107,122,${0.4 * p})`; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(c, c, r * (2.1 - 1.05 * p), 0, 7); ctx.stroke();
    }
  } else if (mode === 'thinking') {
    ctx.strokeStyle = 'rgba(255,107,122,.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(c, c, r * 1.3, phase * 2.4, phase * 2.4 + 1.7); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,107,122,.35)';
    ctx.beginPath(); ctx.arc(c, c, r * 1.55, -phase * 3.6, -phase * 3.6 + 1.1); ctx.stroke();
  } else if (mode === 'speaking') {
    amp = 0.45 + 0.55 * Math.abs(Math.sin(phase * 7.3)) * (0.6 + 0.4 * Math.random());
    for (let i = 0; i < 44; i++) {
      const a = i / 44 * Math.PI * 2;
      const w = 0.5 + 0.5 * Math.sin(phase * 9 + i * 0.9);
      const len = 5 + 30 * amp * w;
      ctx.strokeStyle = `rgba(255,107,122,${0.3 + 0.6 * amp * w})`; ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(c + Math.cos(a) * (r + 12), c + Math.sin(a) * (r + 12));
      ctx.lineTo(c + Math.cos(a) * (r + 12 + len), c + Math.sin(a) * (r + 12 + len));
      ctx.stroke();
    }
  }
  requestAnimationFrame(drawOrb);
}
drawOrb();
function setMode(m, msg) { mode = m; if (msg !== undefined) statusEl.textContent = msg; }

function addMsg(who, text) {
  const w = document.createElement('div'); w.className = 'who ' + (who === 'PENNY' ? 'penny' : '');
  w.textContent = who;
  const d = document.createElement('div'); d.className = 'msg ' + (who === 'PENNY' ? 'penny' : 'you');
  d.textContent = text;
  logEl.append(w, d); logEl.scrollTop = logEl.scrollHeight;
  return d;
}

// ============ VOICE MODULATION ============

// ---- affect sidecar (§5.1) ----
const POS = new Set(['great','love','awesome','brilliant','happy','excited','amazing','wonderful','fantastic','nice','perfect','yes','thanks','cool','good','haha','funny']);
const NEG = new Set(['angry','hate','terrible','awful','broken','crash','wrong','annoyed','frustrated','sad','tired','stupid','useless','bad','worst','fuck','fucking','shit','damn','crap','no','not']);
const sidecar = {
  ctx: null, analyser: null, stream: null, frames: [], startedAt: 0, timer: null,
  async start() {
    this.frames = []; this.startedAt = Date.now();
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const src = this.ctx.createMediaStreamSource(this.stream);
      this.analyser = this.ctx.createAnalyser();
      this.analyser.fftSize = 1024;
      src.connect(this.analyser);
      const buf = new Float32Array(this.analyser.fftSize);
      this.timer = setInterval(() => {
        this.analyser.getFloatTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
        this.frames.push(Math.sqrt(sum / buf.length));
      }, 60);
    } catch (_) { /* no second mic stream — lexical affect only */ }
  },
  stop(finalText) {
    clearInterval(this.timer);
    if (this.stream) { this.stream.getTracks().forEach((t) => t.stop()); this.stream = null; }
    const dur = Math.max(0.6, (Date.now() - this.startedAt) / 1000);
    const voiced = this.frames.filter((f) => f > 0.01);
    const mean = voiced.length ? voiced.reduce((a, b) => a + b, 0) / voiced.length : 0.05;
    const varr = voiced.length ? voiced.reduce((a, b) => a + (b - mean) ** 2, 0) / voiced.length : 0;
    const loud = Math.min(1, mean * 8);
    const words = (finalText.match(/\S+/g) || []).length;
    const rate = words / dur;
    let pos = 0, neg = 0;
    for (const w of finalText.toLowerCase().match(/[a-z']+/g) || []) {
      if (POS.has(w)) pos++;
      if (NEG.has(w)) neg++;
    }
    const valence = Math.min(1, Math.max(0, 0.6 + 0.35 * (pos - neg) / Math.max(1, pos + neg)));
    const arousal = Math.min(1, 0.25 + 0.45 * loud + 0.18 * Math.min(1, Math.sqrt(varr) * 10) + 0.15 * Math.min(1, rate / 4));
    let label = null;
    if (valence < 0.4 && arousal > 0.55) label = 'frustrated';
    else if (valence < 0.45 && arousal < 0.35) label = 'tired';
    else if (valence > 0.7 && arousal > 0.6) label = 'excited';
    return { arousal: +arousal.toFixed(2), valence: +valence.toFixed(2), rate: +rate.toFixed(2), loudness: +loud.toFixed(2), label };
  },
};

// ---- session mood (§5.3) ----
const HALF_LIFE_MS = 3.5 * 3600 * 1000;
function loadMood() { try { return JSON.parse(localStorage.getItem('kate_mood')) || null; } catch { return null; } }
function updateMood(affect) {
  const now = Date.now();
  const old = loadMood();
  let a = affect.arousal, v = affect.valence, w = 1;
  if (old) {
    const decay = Math.pow(0.5, (now - old.t) / HALF_LIFE_MS);
    const ow = (old.w || 1) * decay;
    a = (old.arousal * ow + affect.arousal) / (ow + 1);
    v = (old.valence * ow + affect.valence) / (ow + 1);
    w = Math.min(20, ow + 1);
  }
  const mood = { arousal: +a.toFixed(2), valence: +v.toFixed(2), w: +w.toFixed(2), t: now };
  localStorage.setItem('kate_mood', JSON.stringify(mood));
  return mood;
}

// ---- voice engines: HER (server Aura, British female) or PHONE (browser) ----
let voiceMode = localStorage.getItem('penny_voice_mode') || 'cloud';
let browserVoice = null, browserVoiceName = localStorage.getItem('penny_browser_voice') || null;
function enVoices() {
  return speechSynthesis.getVoices().filter((v) => /^en/i.test(v.lang));
}
function pickVoice() {
  const vs = enVoices();
  browserVoice = (browserVoiceName && vs.find((v) => v.name === browserVoiceName))
    || vs.find((v) => /en[-_]GB/i.test(v.lang) && /female|Kate|Serena|Sonia|Libby/i.test(v.name))
    || vs.find((v) => /en[-_]GB/i.test(v.lang))
    || vs[0] || null;
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();
function refreshVoicePills() {
  $('#voiceBtn').textContent = voiceMode === 'cloud' ? 'VOICE·HER' : 'VOICE·PHONE';
  $('#voiceBtn').classList.toggle('on', voiceMode === 'cloud');
  $('#pickBtn').style.display = voiceMode === 'browser' ? '' : 'none';
  if (voiceMode === 'browser' && browserVoice) $('#pickBtn').textContent = '▸ ' + browserVoice.name.slice(0, 22).toUpperCase();
}
$('#voiceBtn').onclick = () => {
  voiceMode = voiceMode === 'cloud' ? 'browser' : 'cloud';
  localStorage.setItem('penny_voice_mode', voiceMode);
  refreshVoicePills();
};
$('#pickBtn').onclick = () => {
  const vs = enVoices();
  if (!vs.length) return;
  const i = vs.findIndex((v) => browserVoice && v.name === browserVoice.name);
  browserVoice = vs[(i + 1) % vs.length];
  browserVoiceName = browserVoice.name;
  localStorage.setItem('penny_browser_voice', browserVoiceName);
  refreshVoicePills();
  const u = new SpeechSynthesisUtterance('Hello, this is how I sound.');
  u.voice = browserVoice; u.pitch = 1; u.rate = 1.05;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
};
refreshVoicePills();

async function fetchTtsBlob(text, signal) {
  const r = await fetch('/api/tts', {
    method: 'POST',
    headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token() },
    body: JSON.stringify({ text }), signal,
  });
  if (!r.ok) throw new Error('tts ' + r.status);
  return URL.createObjectURL(await r.blob());
}

// ---- unified segment player: streams in, speaks in order, tracks cut point ----
const player = {
  q: [], playing: false, cancelled: false, inputDone: false,
  spokenSoFar: '', currentSeg: '', progress: 0,
  audioEl: null, onFirstAudio: null, onAllDone: null, first: true,
  begin(onFirstAudio, onAllDone) {
    this.stop();
    this.q = []; this.playing = false; this.cancelled = false; this.inputDone = false;
    this.spokenSoFar = ''; this.currentSeg = ''; this.progress = 0; this.first = true;
    this.onFirstAudio = onFirstAudio; this.onAllDone = onAllDone;
  },
  enqueue(seg) {
    if (this.cancelled) return;
    if (voiceMode === 'cloud') seg.__audio = fetchTtsBlob(seg.text).catch(() => null); // prefetch in parallel
    this.q.push(seg);
    if (!this.playing) { this.playing = true; this.loop(); }
  },
  finish() {
    this.inputDone = true;
    if (!this.playing && !this.q.length && !this.cancelled && this.onAllDone) this.onAllDone();
  },
  async loop() {
    while (!this.cancelled) {
      const seg = this.q.shift();
      if (!seg) {
        this.playing = false;
        if (this.inputDone && !this.cancelled && this.onAllDone) this.onAllDone();
        return;
      }
      if (seg.pausePre) await new Promise((r) => setTimeout(r, seg.pausePre));
      if (this.cancelled) return;
      this.currentSeg = seg.text; this.progress = 0;
      try {
        if (voiceMode === 'cloud') await this.playCloud(seg);
        else await this.playBrowser(seg);
      } catch (_) { /* segment failed — keep going */ }
      if (this.cancelled) return;
      this.spokenSoFar += seg.text + ' ';
      if (seg.pausePost) await new Promise((r) => setTimeout(r, seg.pausePost));
    }
  },
  async playCloud(seg) {
    const url = await seg.__audio;
    if (!url) return this.playBrowser(seg); // tts failed → phone voice for this clause
    if (this.cancelled) return;
    await new Promise((resolve) => {
      const a = new Audio(url);
      this.audioEl = a;
      a.playbackRate = Math.min(1.3, Math.max(0.8, seg.rate || 1));
      a.volume = seg.volume ?? 1;
      a.onplaying = () => { if (this.first) { this.first = false; this.onFirstAudio && this.onFirstAudio(); } };
      a.ontimeupdate = () => { if (a.duration) this.progress = a.currentTime / a.duration; };
      a.onended = () => { URL.revokeObjectURL(url); resolve(); };
      a.onerror = () => resolve();
      a.play().catch(() => resolve());
    });
    this.audioEl = null;
  },
  playBrowser(seg) {
    return new Promise((resolve) => {
      const u = new SpeechSynthesisUtterance(seg.text);
      if (browserVoice) u.voice = browserVoice;
      u.rate = seg.rate || 1; u.pitch = seg.pitch || 1; u.volume = seg.volume ?? 1;
      u.onstart = () => { if (this.first) { this.first = false; this.onFirstAudio && this.onFirstAudio(); } };
      u.onboundary = (e) => { this.progress = seg.text.length ? (e.charIndex || 0) / seg.text.length : 0; };
      u.onend = resolve; u.onerror = resolve;
      speechSynthesis.speak(u);
    });
  },
  stop() {
    this.cancelled = true; this.playing = false; this.q = [];
    if (this.audioEl) { try { this.audioEl.pause(); } catch (_) {} this.audioEl = null; }
    speechSynthesis.cancel();
  },
  cutPosition() {
    const idx = Math.floor(this.currentSeg.length * Math.min(1, this.progress + 0.15));
    return (this.spokenSoFar + this.currentSeg.slice(0, idx)).trim().slice(-100);
  },
  isSpeaking() { return this.playing && !this.cancelled; },
};

// ---- filler bridges (§3.2): pre-synthesized so they play instantly ----
const BRIDGES = {
  low: ['Mm, let me think.', 'Okay — one moment.'],
  mid: ['Hmm —', 'Okay, so…', 'Let me look…'],
  high: ['Ooh — okay, so…', 'Right, let me see —'],
};
const bridgeCache = new Map();
function warmBridges() {
  if (voiceMode !== 'cloud' || bridgeCache.size) return;
  for (const list of Object.values(BRIDGES)) {
    for (const t of list) fetchTtsBlob(t).then((u) => bridgeCache.set(t, u)).catch(() => {});
  }
}
function speakBridge() {
  const v = (loadMood() || {}).valence ?? 0.6;
  const list = v < 0.4 ? BRIDGES.low : v > 0.7 ? BRIDGES.high : BRIDGES.mid;
  const t = list[Math.floor(Math.random() * list.length)];
  if (voiceMode === 'cloud' && bridgeCache.has(t)) {
    new Audio(bridgeCache.get(t)).play().catch(() => {});
  } else {
    const u = new SpeechSynthesisUtterance(t);
    if (browserVoice) u.voice = browserVoice;
    u.rate = 1.0; u.pitch = 1.0; u.volume = 0.9;
    speechSynthesis.speak(u);
  }
}

// ---- speculation (§3.1) ----
function jaccard(a, b) {
  const A = new Set(a.toLowerCase().match(/[a-z']+/g) || []);
  const B = new Set(b.toLowerCase().match(/[a-z']+/g) || []);
  if (!A.size || !B.size) return 0;
  let inter = 0;
  for (const w of A) if (B.has(w)) inter++;
  return inter / (A.size + B.size - inter);
}
const spec = {
  draft: null, basis: '', ctrl: null, timer: null,
  arm(getPartial, buildBody) {
    this.timer = setInterval(async () => {
      const partial = getPartial().trim();
      if (partial.split(/\s+/).length < 5 || partial === this.basis) return;
      this.basis = partial;
      this.ctrl && this.ctrl.abort();
      this.ctrl = new AbortController();
      try {
        const res = await api('/api/chat', { ...buildBody(partial), draft: true }, this.ctrl.signal);
        // pre-synthesize the first clause too: a hit then starts in ~0ms
        if (voiceMode === 'cloud' && res.segments && res.segments[0]) {
          res.segments[0].__audio = fetchTtsBlob(res.segments[0].text).catch(() => null);
        }
        this.draft = { basis: partial, res };
      } catch (_) {}
    }, 700);
  },
  disarm() { clearInterval(this.timer); this.timer = null; if (this.ctrl) this.ctrl.abort(); },
  take(finalText) {
    const d = this.draft; this.draft = null; this.basis = '';
    if (d && jaccard(d.basis, finalText) >= 0.92) return d.res;
    return null;
  },
};

// ---- stats (§7.5) ----
const stats = { turns: 0, specHits: 0, lastTtfa: null };
function showStats(tone) {
  const bits = [];
  if (stats.lastTtfa !== null) bits.push('TTFA ' + stats.lastTtfa + 'ms');
  if (stats.turns) bits.push('SPEC ' + Math.round(100 * stats.specHits / stats.turns) + '%');
  if (tone) bits.push(tone.toUpperCase());
  statsEl.textContent = bits.join(' · ');
}

// ---- speech in ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, interimText = '';
if (!SR) { talkBtn.disabled = true; statusEl.textContent = 'voice input needs Chrome — typing still works'; }
function startListening() {
  if (!SR || listening) return;
  if (player.isSpeaking()) { lastCut = player.cutPosition(); }
  player.stop();
  warmBridges();
  rec = new SR();
  rec.lang = 'en-GB'; rec.interimResults = true; rec.continuous = false;
  listening = true; interimText = '';
  talkBtn.classList.add('listening'); talkBtn.textContent = '● LIVE';
  setMode('listening', 'listening…');
  sidecar.start();
  spec.arm(() => interimText, (partial) => chatBody(partial));
  let finalText = '';
  rec.onresult = (e) => {
    let interim = '';
    for (const res of e.results) (res.isFinal ? (finalText += res[0].transcript) : (interim += res[0].transcript));
    interimText = (finalText + ' ' + interim).trim();
    statusEl.textContent = '“' + interimText + '”';
  };
  rec.onerror = (e) => { spec.disarm(); stopUi(); setMode('idle', e.error === 'not-allowed' ? 'allow microphone access, then retry' : ' '); };
  rec.onend = () => {
    spec.disarm(); stopUi();
    const said = finalText.trim() || interimText.trim();
    if (said) { turnEndAt = Date.now(); handleUtterance(said, sidecar.stop(said)); }
    else { sidecar.stop(''); setMode('idle', ' '); }
  };
  rec.start();
}
function stopUi() { listening = false; talkBtn.classList.remove('listening'); talkBtn.textContent = 'TALK'; }

let conversationMode = false;
$('#convBtn').onclick = () => {
  conversationMode = !conversationMode;
  $('#convBtn').classList.toggle('on', conversationMode);
};

// ---- the turn ----
let chatHistory = [], conversationId = null, lastCut = null, prevAffect = null, turnEndAt = 0;
const RECALL = /what did i (?:say|tell you) about (.+?)\??$|what do you (?:know|remember) about (.+?)\??$/i;

function chatBody(userText) {
  return {
    messages: [...chatHistory, { role: 'user', content: userText }],
    conversation_id: conversationId,
    prev_affect: prevAffect,
    mood: loadMood(),
    hour: new Date().getHours(),
    cut_context: lastCut,
  };
}

function beginSpeaking(tone) {
  player.begin(
    () => { stats.lastTtfa = Date.now() - turnEndAt; setMode('speaking', ' '); showStats(tone); },
    () => { setMode('idle', conversationMode ? 'listening again…' : ' '); if (conversationMode) setTimeout(startListening, 350); },
  );
}

/** Streaming turn: play each shaped clause the moment the model finishes it. */
async function streamTurn(body, pennyEl, bridgeTimer) {
  const r = await fetch('/api/chat-stream', {
    method: 'POST',
    headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token() },
    body: JSON.stringify(body),
  });
  if (!r.ok || !r.body) throw new Error('stream ' + r.status);
  const reader = r.body.getReader();
  const decoder = new TextDecoder();
  let sse = '', result = null;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    sse += decoder.decode(value, { stream: true });
    const lines = sse.split('\n');
    sse = lines.pop() || '';
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      let ev;
      try { ev = JSON.parse(line.slice(6)); } catch { continue; }
      if (ev.segment) {
        clearTimeout(bridgeTimer);
        pennyEl.textContent = (pennyEl.textContent + ' ' + ev.segment.text).trim();
        logEl.scrollTop = logEl.scrollHeight;
        player.enqueue(ev.segment);
      } else if (ev.done) {
        result = ev;
      } else if (ev.error) {
        throw new Error(ev.error);
      }
    }
  }
  if (!result) throw new Error('stream ended without result');
  return result;
}

async function handleUtterance(text, affect) {
  addMsg('YOU', text);
  setMode('thinking', 'thinking…');
  affect = affect || { arousal: 0.5, valence: 0.6, rate: 2.6, loudness: 0.5, label: null };
  try {
    let reply, tone = null, speculativeHit = false;
    const rm = text.match(RECALL);
    if (rm || /^(?:moneypenny[,;]?\s*)?(?:forget|pin) (?:that|it|this)\.?$/i.test(text)) {
      if (rm) {
        const q = (rm[1] || rm[2]).trim();
        const hits = await api('/api/recall', { query: q });
        reply = hits.length
          ? `About ${q} — on ${new Date(hits[0].created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'long' })} you said: “${hits[0].content}”.`
          : `I don't have anything about ${q} in my memory yet.`;
      } else if (/forget/i.test(text)) {
        reply = (await api('/api/forget-last', {})).forgotten ? "Forgotten. It's gone from my memory." : 'There was nothing recent to forget.';
      } else {
        reply = (await api('/api/pin-last', {})).pinned ? "Pinned. I'll keep that permanently." : 'There was nothing recent to pin.';
      }
      addMsg('PENNY', reply);
      beginSpeaking(null);
      player.enqueue({ text: reply, rate: 1.05, pitch: 1, volume: 1 });
      player.finish();
    } else {
      const cached = spec.take(text);
      if (cached) {
        speculativeHit = true;
        reply = cached.reply || '…';
        tone = cached.tone;
        api('/api/log', { user: text, reply, conversation_id: conversationId }).then((res) => { conversationId = conversationId || res.conversation_id; }).catch(() => {});
        addMsg('PENNY', reply);
        beginSpeaking(tone);
        for (const seg of cached.segments || [{ text: reply, rate: 1.05, pitch: 1, volume: 1 }]) player.enqueue(seg);
        player.finish();
      } else {
        const body = chatBody(text);
        body.affect = affect;
        const bridgeTimer = setTimeout(speakBridge, 600);
        const pennyEl = addMsg('PENNY', '');
        beginSpeaking(null);
        let result;
        try {
          result = await streamTurn(body, pennyEl, bridgeTimer);
        } catch (_) {
          // stream broke → plain request
          clearTimeout(bridgeTimer);
          result = await api('/api/chat', body);
          pennyEl.textContent = result.reply || '…';
          for (const seg of result.segments || [{ text: result.reply, rate: 1.05, pitch: 1, volume: 1 }]) player.enqueue(seg);
        } finally {
          clearTimeout(bridgeTimer);
        }
        player.finish();
        reply = result.reply || pennyEl.textContent;
        tone = result.tone;
        pennyEl.textContent = reply;
        conversationId = result.conversation_id || conversationId;
        showStats(tone);
      }
      chatHistory.push({ role: 'user', content: text }, { role: 'assistant', content: reply });
      stats.turns++;
      if (speculativeHit) stats.specHits++;
      showStats(tone);
    }
    lastCut = null;
    prevAffect = affect;
    updateMood(affect);
  } catch (e) {
    setMode('idle', ' ');
    addMsg('PENNY', 'Something went wrong: ' + e.message);
  }
}

talkBtn.onclick = () => (listening ? rec && rec.stop() : startListening());
$('#send').onclick = sendTyped;
textIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendTyped(); });
function sendTyped() {
  const t = textIn.value.trim();
  if (!t) return;
  textIn.value = '';
  turnEndAt = Date.now();
  warmBridges();
  handleUtterance(t, null);
}
