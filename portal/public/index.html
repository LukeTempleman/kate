<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MONEYPENNY</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2232%22 fill=%22none%22 stroke=%22%23FF6B7A%22 stroke-width=%224%22/><circle cx=%2250%22 cy=%2250%22 r=%229%22 fill=%22%23FF6B7A%22/></svg>">
<style>
  :root { --base:#0D0709; --surface:#161014; --line:#2E2226; --red:#FF6B7A; --red-dim:#9E4552;
          --text:#F7E9EB; --dim:#9C8A8E; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--base); color:var(--text); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
         height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:center; gap:10px; padding:14px 18px; }
  h1 { color:var(--red); font-weight:500; letter-spacing:.15em; font-size:1.05rem; }
  .pill { font-size:.6rem; letter-spacing:.12em; color:var(--dim); border:1px solid var(--line);
          border-radius:999px; padding:4px 10px; }
  #convBtn.on { color:var(--red); border-color:var(--red); }
  #orbWrap { display:flex; justify-content:center; padding:6px 0 0; }
  canvas#orb { width:190px; height:190px; }
  #status { text-align:center; color:var(--dim); font-size:.8rem; min-height:1.4em; padding:4px 16px; }
  #log { flex:1; overflow-y:auto; padding:8px 20px 12px; }
  .who { font-size:.62rem; letter-spacing:.15em; color:var(--dim); margin-top:12px; }
  .who.penny { color:var(--red-dim); }
  .msg { font-size:1rem; line-height:1.55; }
  .msg.penny { color:var(--text); }
  .msg.you { color:var(--dim); }
  footer { display:flex; gap:10px; padding:12px 16px calc(14px + env(safe-area-inset-bottom)); }
  #talk { flex:0 0 auto; min-width:112px; height:58px; border-radius:20px; border:1.5px solid var(--red);
          background:none; color:var(--red); font:inherit; font-size:.95rem; letter-spacing:.15em; }
  #talk.listening { background:var(--red); color:var(--base); }
  #talk:disabled { opacity:.4; }
  #text { flex:1; height:58px; border-radius:20px; border:1px solid var(--line); background:var(--surface);
          color:var(--text); font:inherit; padding:0 16px; font-size:.95rem; }
  #text:focus { outline:none; border-color:var(--red-dim); }
  #send { flex:0 0 auto; width:58px; height:58px; border-radius:20px; border:1px solid var(--line);
          background:none; color:var(--red); font-size:1.3rem; }
</style>
</head>
<body>
<header>
  <h1>MONEYPENNY</h1>
  <span class="pill" id="brainPill">BRAIN·CLOUD</span>
  <span class="pill" id="convBtn">AUTO-LISTEN</span>
  <span class="pill" style="margin-left:auto"><a href="/dashboard" style="color:inherit;text-decoration:none">DASH</a></span>
</header>
<div id="orbWrap"><canvas id="orb" width="380" height="380"></canvas></div>
<div id="status">tap TALK and speak</div>
<div id="log"></div>
<footer>
  <button id="talk">TALK</button>
  <input id="text" placeholder="or type to her…" autocomplete="off">
  <button id="send">➤</button>
</footer>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const statusEl = $('#status'), logEl = $('#log'), talkBtn = $('#talk'), textIn = $('#text');

// ---- token (one-time): accepts #t=TOKEN links, else asks once ----
(function initToken() {
  const m = location.hash.match(/t=([A-Za-z0-9]+)/);
  if (m) { localStorage.setItem('kate_token', m[1]); history.replaceState(null, '', location.pathname); }
})();
function token() {
  let t = localStorage.getItem('kate_token');
  if (!t) { t = prompt('Paste your Moneypenny key (one time):') || ''; localStorage.setItem('kate_token', t); }
  return t;
}
async function api(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token() },
    body: JSON.stringify(body),
  });
  if (r.status === 401) { localStorage.removeItem('kate_token'); throw new Error('wrong key — reload and paste it again'); }
  if (!r.ok) throw new Error('server ' + r.status);
  return r.json();
}

// ---- orb ----
const ctx = $('#orb').getContext('2d');
let mode = 'idle', amp = 0, phase = 0;
function drawOrb() {
  phase += 0.016;
  const c = 190, r = 62;
  ctx.clearRect(0, 0, 380, 380);
  const glow = ctx.createRadialGradient(c, c, 0, c, c, r * 2.1);
  const g = mode === 'listening' ? 0.5 : mode === 'speaking' ? 0.32 + amp * 0.3 : 0.25;
  glow.addColorStop(0, `rgba(255,107,122,${g})`);
  glow.addColorStop(1, 'rgba(255,107,122,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(c, c, r * 2.1, 0, 7); ctx.fill();
  ctx.strokeStyle = '#FF6B7A'; ctx.lineWidth = 2.4;
  const breath = mode === 'idle' ? 1 + 0.03 * Math.sin(phase * 1.6) : 1;
  ctx.beginPath(); ctx.arc(c, c, r * breath, 0, 7); ctx.stroke();
  ctx.fillStyle = '#FF6B7A'; ctx.beginPath(); ctx.arc(c, c, 10, 0, 7); ctx.fill();
  if (mode === 'listening') {
    for (let i = 0; i < 3; i++) {
      const p = ((phase * 0.5) + i / 3) % 1;
      ctx.strokeStyle = `rgba(255,107,122,${0.4 * p})`; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(c, c, r * (2.1 - 1.05 * p), 0, 7); ctx.stroke();
    }
  } else if (mode === 'thinking') {
    ctx.strokeStyle = 'rgba(255,107,122,.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(c, c, r * 1.3, phase * 2.4, phase * 2.4 + 1.7); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,107,122,.35)';
    ctx.beginPath(); ctx.arc(c, c, r * 1.55, -phase * 3.6, -phase * 3.6 + 1.1); ctx.stroke();
  } else if (mode === 'speaking') {
    amp = 0.45 + 0.55 * Math.abs(Math.sin(phase * 7.3)) * (0.6 + 0.4 * Math.random());
    for (let i = 0; i < 44; i++) {
      const a = i / 44 * Math.PI * 2;
      const w = 0.5 + 0.5 * Math.sin(phase * 9 + i * 0.9);
      const len = 5 + 30 * amp * w;
      ctx.strokeStyle = `rgba(255,107,122,${0.3 + 0.6 * amp * w})`; ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(c + Math.cos(a) * (r + 12), c + Math.sin(a) * (r + 12));
      ctx.lineTo(c + Math.cos(a) * (r + 12 + len), c + Math.sin(a) * (r + 12 + len));
      ctx.stroke();
    }
  }
  requestAnimationFrame(drawOrb);
}
drawOrb();
function setMode(m, msg) { mode = m; if (msg !== undefined) statusEl.textContent = msg; }

// ---- transcript ----
function addMsg(who, text) {
  const w = document.createElement('div'); w.className = 'who ' + (who === 'PENNY' ? 'penny' : '');
  w.textContent = who;
  const d = document.createElement('div'); d.className = 'msg ' + (who === 'PENNY' ? 'penny' : 'you');
  d.textContent = text;
  logEl.append(w, d); logEl.scrollTop = logEl.scrollHeight;
  return d;
}

// ---- voice out: browser TTS, British female preferred ----
let voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  voice = vs.find((v) => /en[-_]GB/i.test(v.lang) && /female|Kate|Serena|Sonia|Libby/i.test(v.name))
    || vs.find((v) => /en[-_]GB/i.test(v.lang))
    || vs.find((v) => /^en/i.test(v.lang)) || null;
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();
function speak(text, onDone) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.rate = 1.04; u.pitch = 1.0;
  u.onend = () => { setMode('idle', conversationMode ? 'listening again…' : ' '); onDone && onDone(); };
  u.onerror = () => { setMode('idle', ' '); onDone && onDone(); };
  setMode('speaking', ' ');
  speechSynthesis.speak(u);
}

// ---- voice in: browser speech recognition ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
if (!SR) { talkBtn.disabled = true; statusEl.textContent = 'voice input needs Chrome — typing still works'; }
function startListening() {
  if (!SR || listening) return;
  speechSynthesis.cancel();
  rec = new SR();
  rec.lang = 'en-GB'; rec.interimResults = true; rec.continuous = false;
  listening = true; talkBtn.classList.add('listening'); talkBtn.textContent = '● LIVE';
  setMode('listening', 'listening…');
  let finalText = '';
  rec.onresult = (e) => {
    let interim = '';
    for (const res of e.results) (res.isFinal ? (finalText += res[0].transcript) : (interim += res[0].transcript));
    statusEl.textContent = '“' + (finalText + interim).trim() + '”';
  };
  rec.onerror = (e) => { stopUi(); setMode('idle', e.error === 'not-allowed' ? 'allow microphone access, then retry' : ' '); };
  rec.onend = () => {
    stopUi();
    const said = finalText.trim();
    if (said) handleUtterance(said); else setMode('idle', ' ');
  };
  rec.start();
}
function stopUi() { listening = false; talkBtn.classList.remove('listening'); talkBtn.textContent = 'TALK'; }

// ---- conversation mode: she listens again after speaking ----
let conversationMode = false;
$('#convBtn').onclick = () => {
  conversationMode = !conversationMode;
  $('#convBtn').classList.toggle('on', conversationMode);
};

// ---- brain + memory ----
let chatHistory = [], conversationId = null;
const RECALL = /what did i (?:say|tell you) about (.+?)\??$|what do you (?:know|remember) about (.+?)\??$/i;
async function handleUtterance(text) {
  addMsg('YOU', text);
  setMode('thinking', 'thinking…');
  try {
    let reply;
    const rm = text.match(RECALL);
    if (rm) {
      const q = (rm[1] || rm[2]).trim();
      const hits = await api('/api/recall', { query: q });
      reply = hits.length
        ? `About ${q} — on ${new Date(hits[0].created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'long' })} you said: “${hits[0].content}”.`
        : `I don't have anything about ${q} in my memory yet.`;
    } else if (/^(?:moneypenny[,;]?\s*)?forget (?:that|it|this)\.?$/i.test(text)) {
      const r = await api('/api/forget-last', {});
      reply = r.forgotten ? "Forgotten. It's gone from my memory." : 'There was nothing recent to forget.';
    } else if (/^(?:moneypenny[,;]?\s*)?pin (?:that|this|it)\.?$/i.test(text)) {
      const r = await api('/api/pin-last', {});
      reply = r.pinned ? "Pinned. I'll keep that permanently." : 'There was nothing recent to pin.';
    } else {
      chatHistory.push({ role: 'user', content: text });
      const r = await api('/api/chat', { messages: chatHistory, conversation_id: conversationId });
      conversationId = r.conversation_id;
      reply = r.reply || '…';
      chatHistory.push({ role: 'assistant', content: reply });
    }
    addMsg('PENNY', reply);
    speak(reply, () => { if (conversationMode) setTimeout(startListening, 350); });
  } catch (e) {
    setMode('idle', ' ');
    addMsg('PENNY', 'Something went wrong: ' + e.message);
  }
}

talkBtn.onclick = () => (listening ? rec && rec.stop() : startListening());
$('#send').onclick = sendTyped;
textIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendTyped(); });
function sendTyped() {
  const t = textIn.value.trim();
  if (!t) return;
  textIn.value = '';
  handleUtterance(t);
}
</script>
</body>
</html>
